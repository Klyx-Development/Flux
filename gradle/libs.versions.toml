[versions]
paper-api = "26.3.build.+"
shadow = "9.6.1"
run-paper = "3.1.0"
paperweight-userdev = "2.0.0-beta.21"
jetbrains-annotations = "26.0.2"
jspecify = "1.0.0"
fastutil = "8.5.19"
adventure = "4.26.1"
joml = "1.10.8"
slf4j = "2.0.18"
gson = "2.13.1"
exo = "3.1.4"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
